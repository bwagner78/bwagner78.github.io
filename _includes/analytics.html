{%- comment -%}
  GoatCounter. Renders only when a code is set AND the site is served from its
  real URL (skips localhost during development).
{%- endcomment -%}
{%- if site.goatcounter_code and site.goatcounter_code != "" -%}
<script data-goatcounter="https://{{ site.goatcounter_code }}.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
{%- endif -%}
