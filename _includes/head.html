<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#4a5a43" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#8fa877" media="(prefers-color-scheme: dark)">

{%- if page.title -%}
  <title>{{ page.title }} · {{ site.title }}</title>
{%- else -%}
  <title>{{ site.title }} — {{ site.subtitle }}</title>
{%- endif -%}

<!-- Set the colour scheme before first paint to avoid a flash. -->
<script>
  (function () {
    try {
      var t = localStorage.getItem('theme');
      if (t === 'light' || t === 'dark') {
        document.documentElement.setAttribute('data-theme', t);
      }
    } catch (e) {}
  })();
</script>

<!-- Fonts. To self-host instead, drop .woff2 files in /assets/fonts and swap
     these links for @font-face rules (see README). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=IBM+Plex+Mono:wght@400;500&display=swap">

<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
<link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
<link rel="alternate" type="application/feed+json" title="{{ site.title }}" href="{{ '/feed.json' | relative_url }}">
<link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="canonical" href="{{ page.url | absolute_url }}">

<!-- IndieWeb: uncomment once you set up webmention.io -->
<!-- <link rel="webmention" href="https://webmention.io/brettwagner.me/webmention"> -->

<meta name="description" content="{{ page.description | default: site.description }}">
{% assign og_image = page.image | default: site.default_image %}
<meta property="og:site_name" content="{{ site.title }}">
<meta property="og:title" content="{{ page.title | default: site.title }}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="{{ og_image | absolute_url }}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{ site.title }} — {{ site.subtitle }}">
<meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="{{ og_image | absolute_url }}">
