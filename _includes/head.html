<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#4a5a43" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#8fa877" media="(prefers-color-scheme: dark)">

{%- if page.title -%}
  <title>{{ page.title }} · {{ site.title }}</title>
{%- else -%}
  <title>{{ site.title }} — {{ site.subtitle }}</title>
{%- endif -%}

<!-- Set the colour scheme before first paint to avoid a flash. -->
<script>
  (function () {
    try {
      var t = localStorage.getItem('theme');
      if (t === 'light' || t === 'dark') {
        document.documentElement.setAttribute('data-theme', t);
      }
    } catch (e) {}
  })();
</script>

<!-- Fonts. To self-host instead, drop .woff2 files in /assets/fonts and swap
     these links for @font-face rules (see README). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=IBM+Plex+Mono:wght@400;500&display=swap">

<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

<link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
<link rel="alternate" type="application/feed+json" title="{{ site.title }}" href="{{ '/feed.json' | relative_url }}">
<link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml">
