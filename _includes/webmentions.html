<div class="webmentions">
  <div id="webmentions-facepile" class="webmentions-facepile" hidden>
    <h3 class="webmentions-heading">Likes &amp; Reposts</h3>
    <ul id="webmentions-facepile-list" class="webmentions-facepile-list"></ul>
  </div>

  <div id="webmentions-replies" class="webmentions-replies" hidden>
    <h3 class="webmentions-heading">Mentions</h3>
    <ul id="webmentions-replies-list" class="webmentions-replies-list"></ul>
  </div>
</div>

<style>
  .webmentions { margin: 2rem 0; }
  .webmentions-heading { font-size: 1.1rem; margin-bottom: 0.75rem; }
  .webmentions-facepile-list { list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: 0.4rem; }
  .webmentions-facepile-list img { width: 40px; height: 40px; border-radius: 50%; }
  .webmentions-replies-list { list-style: none; padding: 0; }
  .webmention-reply { display: flex; gap: 0.75rem; padding: 0.75rem 0; border-top: 1px solid #eee; }
  .webmention-reply img { width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0; }
  .webmention-reply-body { font-size: 0.95rem; }
  .webmention-reply-author { font-weight: 600; }
  .webmention-reply-meta { color: #999; font-size: 0.8rem; }
</style>

<script>
(function () {
  var target = "{{ page.url | absolute_url }}";
  var api = "https://webmention.io/api/mentions.jf2?per-page=100&target=" + encodeURIComponent(target);

  fetch(api)
    .then(function (r) { return r.json(); })
    .then(function (data) {
      var children = (data && data.children) || [];
      if (!children.length) return;

      var facepileTypes = ["like-of", "repost-of"];
      var replyTypes = ["in-reply-to", "mention-of"];

      var facepile = [];
      var replies = [];

      children.forEach(function (m) {
        if (facepileTypes.indexOf(m["wm-property"]) !== -1) facepile.push(m);
        else if (replyTypes.indexOf(m["wm-property"]) !== -1) replies.push(m);
      });

      function safeName(author) {
        return (author && author.name) ? author.name : "Someone";
      }

      if (facepile.length) {
        var fp = document.getElementById("webmentions-facepile-list");
        facepile.forEach(function (m) {
          var author = m.author || {};
          var li = document.createElement("li");
          var content = "";
          if (author.photo) {
            content = '<img src="' + author.photo + '" alt="' + safeName(author) + '" title="' + safeName(author) + '">';
          } else {
            content = '<span title="' + safeName(author) + '">' + safeName(author) + '</span>';
          }
          if (author.url) {
            li.innerHTML = '<a href="' + author.url + '" rel="nofollow">' + content + '</a>';
          } else {
            li.innerHTML = content;
          }
          fp.appendChild(li);
        });
        document.getElementById("webmentions-facepile").hidden = false;
      }

      if (replies.length) {
        var rp = document.getElementById("webmentions-replies-list");
        replies.forEach(function (m) {
          var author = m.author || {};
          var text = (m.content && (m.content.text || m.content.html)) || "";
          var when = m.published ? new Date(m.published).toLocaleDateString() : "";
          var li = document.createElement("li");
          li.className = "webmention-reply";

          var avatar = author.photo
            ? '<img src="' + author.photo + '" alt="" >'
            : "";

          var nameHtml = author.url
            ? '<a href="' + author.url + '" rel="nofollow">' + safeName(author) + "</a>"
            : safeName(author);

          li.innerHTML =
            avatar +
            '<div class="webmention-reply-body">' +
              '<span class="webmention-reply-author">' + nameHtml + "</span> " +
              '<span class="webmention-reply-meta">' + when + "</span>" +
              "<div>" + text + "</div>" +
            "</div>";
          rp.appendChild(li);
        });
        document.getElementById("webmentions-replies").hidden = false;
      }
    })
    .catch(function () { /* silent: no mentions shown on error */ });
})();
</script>
