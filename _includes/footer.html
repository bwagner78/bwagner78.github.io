<footer class="site-footer" role="contentinfo">
  <hr class="dinkus" aria-hidden="true">
  <p class="h-card site-footer__card">
    <a class="p-name u-url" rel="me author" href="{{ site.author.url }}">{{ site.url | remove: 'https://' | remove: 'http://' | remove: 'www.' }}</a>
    <span class="site-footer__sep">·</span>
    <span class="site-footer__tagline">{{ site.subtitle }}</span>
    {%- for link in site.me -%}<a class="u-url" rel="me" href="{{ link }}" hidden></a>{%- endfor -%}
  </p>
  <p class="site-footer__meta">
   <a href="mailto:{{ site.author.email }}">Email</a>
    <span class="site-footer__sep">·</span>
    <a href="{{ '/feed.xml' | relative_url }}">Subscribe</a>
    <span class="site-footer__sep">·</span>
    <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Switch colour theme">◐ Theme</button>
  </p>
</footer>
