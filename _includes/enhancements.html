<script>
(function () {
  // ---- Theme toggle (light / dark / clear-to-system) --------------------
  var root = document.documentElement;
  var btn  = document.getElementById('theme-toggle');
  if (btn) {
    btn.addEventListener('click', function () {
      var current = root.getAttribute('data-theme');
      var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      var effective = current || (systemDark ? 'dark' : 'light');
      var next = effective === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      try { localStorage.setItem('theme', next); } catch (e) {}
    });
  }

  // ---- Auto table of contents (opt in with `toc: true` front matter) -----
  var mount = document.querySelector('[data-toc]');
  var content = document.querySelector('.post-content');
  if (mount && content) {
    var heads = content.querySelectorAll('h2, h3');
    if (heads.length >= 2) {
      var list = document.createElement('ol');
      list.className = 'toc__list';
      heads.forEach(function (h) {
        if (!h.id) {
          h.id = h.textContent.trim().toLowerCase()
                  .replace(/[^\w\s-]/g, '').replace(/\s+/g, '-');
        }
        var li = document.createElement('li');
        li.className = 'toc__item toc__item--' + h.tagName.toLowerCase();
        var a = document.createElement('a');
        a.href = '#' + h.id;
        a.textContent = h.textContent;
        li.appendChild(a);
        list.appendChild(li);
      });
      mount.appendChild(list);
      mount.hidden = false;
    }
  }
})();
</script>
