# ---------------------------------------------------------------------------
#  Field Notes — site configuration
#  Edit the values in this file, then commit. GitHub Pages rebuilds on push.
# ---------------------------------------------------------------------------

title: "Field Notes"
subtitle: "Dispatches from ordinary life"
description: "Dispatches from ordinary life — essays, notes, and reflections by Brett Wagner."
author:
  name: "Brett Wagner"
  url: "https://brettwagner.me"
  email: "brett.wagner78@gmail.com"

# Your production URL. No trailing slash.
url: "https://brettwagner.me"
baseurl: ""

# The masthead dateline (mono, catalog-card style)
established: "Est. 2019"

# ---------------------------------------------------------------------------
#  Reading
# ---------------------------------------------------------------------------
# Words shown in a home-page excerpt before the "Read more" link.
excerpt_length: 55
# Posts per page (pagination).
paginate: 8
paginate_path: "/page/:num/"

# ---------------------------------------------------------------------------
#  Analytics — GoatCounter
#  Paste ONLY your code (the subdomain), e.g. if your dashboard is
#  https://brettwagner.goatcounter.com then set: brettwagner
#  Leave blank to disable. Tracking is skipped automatically in local dev.
# ---------------------------------------------------------------------------
goatcounter_code: "brettwagner"

# ---------------------------------------------------------------------------
#  IndieWeb identity — rel="me" links (used for the footer h-card).
#  Add or remove freely. These help services verify it's really you.
# ---------------------------------------------------------------------------
me:
  - "https://sermonaudio.com/"        # replace with your speaker page
  # - "https://github.com/yourhandle"
  # - "mailto:you@brettwagner.me"

# ---------------------------------------------------------------------------
#  Build
# ---------------------------------------------------------------------------
permalink: /:year/:month/:title/
timezone: America/Los_Angeles

markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true
  syntax_highlighter: rouge

sass:
  style: compressed

plugins:
  - jekyll-paginate
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

# jekyll-feed writes the RSS/Atom feed here:
feed:
  path: feed.xml

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: pages
    values:
      layout: page

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .jekyll-cache
